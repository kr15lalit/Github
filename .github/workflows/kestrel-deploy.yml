# Rebuilds Kestrel's market data every weekday after both markets close, then deploys the
# static site in /kestrel to GitHub Pages. Enable once: Settings → Pages → Source: "GitHub Actions".
name: Kestrel — refresh data & deploy

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC = after US close (and 03:47 IST next day, long after NSE close)
  push:
    branches: [main]
    paths: ["kestrel/**", ".github/workflows/kestrel-deploy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kestrel-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kestrel/pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r kestrel/pipeline/requirements.txt
      - name: Build market data
        # If Yahoo is down the committed data/*.json stays in place and the site still deploys.
        run: python kestrel/pipeline/build_data.py || echo "::warning::Data refresh failed; deploying previous data"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kestrel

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
