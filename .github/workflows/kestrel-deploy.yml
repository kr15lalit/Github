# Rebuilds Kestrel's market data every weekday after both markets close, then deploys the
# static site in /kestrel to GitHub Pages. Enable once: Settings → Pages → Source: "GitHub Actions".
name: Kestrel — refresh data & deploy

on:
  schedule:
    # GitHub may start scheduled runs hours late, and Yahoo publishes end-of-day data unevenly,
    # so refresh several times; each run simply rebuilds from the latest data available.
    - cron: "47 12 * * 1-5"   # 18:17 IST: same-evening NSE update
    - cron: "17 22 * * 1-5"   # after US close (03:47 IST next day)
    - cron: "37 3 * * 2-6"    # 09:07 IST morning catch-up before NSE opens
  push:
    branches: [main]
    paths: ["kestrel/**", ".github/workflows/kestrel-deploy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kestrel-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kestrel/pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r kestrel/pipeline/requirements.txt
      - name: Build market data
        # If Yahoo is down the committed data/*.json stays in place and the site still deploys.
        run: python kestrel/pipeline/build_data.py || echo "::warning::Data refresh failed; deploying previous data"
      - name: Build stock analyses (rule-based + free Gemini AI when GEMINI_API_KEY is set)
        # Add the key under Settings → Secrets and variables → Actions → GEMINI_API_KEY (free at aistudio.google.com).
        # Without it, every stock still gets the rule-based read. AI failures never block the deploy.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python kestrel/pipeline/analysis.py || echo "::warning::Analysis step failed; deploying without new analyses"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kestrel

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
