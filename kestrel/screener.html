<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b4f5c" />
  <meta name="description" content="Kestrel screener — technical scans, market breadth, sector rotation and relative-strength ranking for Indian and US equities." />
  <title>Screener · Kestrel</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("kestrel-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="topbar">
    <a class="brand" href="index.html?stay=1" aria-label="Kestrel home"><img src="assets/logo.svg" alt="" /><span class="word">Kes<b>trel</b></span></a>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search symbol, company, or sector" autocomplete="off" aria-label="Search stocks" />
      <kbd>/</kbd>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Market">
        <button data-market="IN" aria-pressed="true">IN</button>
        <button data-market="US" aria-pressed="false">US</button>
      </div>
      <button class="btn icon ghost" id="tourBtn" title="Take the tour" aria-label="Take the tour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></button>
      <button class="btn icon ghost" id="themeBtn" title="Toggle theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
      <button class="btn" id="dataBtn" title="Back up or restore your watchlists, notes and saved filters">My data</button>
    </div>
  </header>

  <main id="main-content" class="wrap">
    <section class="indices" id="indices" aria-label="Benchmark indices"></section>
    <section class="breadth" id="breadth" aria-label="Market breadth"></section>

    <section class="toolbar" id="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button data-view="stocks" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Stocks</button>
        <button data-view="sectors" aria-pressed="false">Sectors</button>
      </div>
      <div class="sel"><label for="capSel">Market cap</label>
        <select id="capSel"><option value="">All market cap</option><option value="LC">Large cap</option><option value="MC">Mid cap</option><option value="SC">Small cap</option><option value="MI">Micro cap</option></select></div>
      <div class="sel"><label for="secSel">Sector</label><select id="secSel"><option value="">All sectors</option></select></div>
      <div class="seg" role="group" aria-label="Timeframe">
        <button data-tf="daily" aria-pressed="true">Daily</button>
        <button data-tf="weekly" aria-pressed="false">Weekly</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="eyeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>Kestrel Eye</button>
      <button class="btn active" id="healthBtn" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Market Health</button>
      <button class="btn" data-panel="saved">My filters</button>
      <button class="btn" data-panel="lists">Watchlists</button>
      <button class="btn" data-panel="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters</button>
      <button class="btn" data-panel="columns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>Columns</button>
    </section>

    <section class="card" id="results">
      <div class="presets" id="presets"><span class="lbl">RECOMMENDED SCANS:</span></div>

      <div class="panel" id="panel-filters" hidden></div>
      <div class="panel" id="panel-columns" hidden></div>
      <div class="panel" id="panel-saved" hidden></div>
      <div class="panel" id="panel-lists" hidden></div>

      <div class="meta"><span id="metaLeft"></span><span id="metaRight"></span></div>
      <div class="active-filters" id="activeFilters"></div>
      <div class="table-wrap" id="tableWrap"><table class="grid" id="grid"></table></div>
      <div class="foot"><span id="showing"></span><button class="btn" id="moreBtn">Show more stocks</button><span>Data is for informational purposes only, not investment advice.</span></div>
    </section>
  </main>

  <div class="modal-back" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalBox"></div></div>
  <div class="tip" id="tip" hidden></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
